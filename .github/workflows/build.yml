# Build and test nux for Linux on x86_64 and arm64, each on a machine of that architecture
# (no cross-compiling), on every push to main. When the version in Cargo.toml has no release
# yet, the run then makes one (tag v<version>) with both binaries: raising the version is
# how to release. Work happens on other branches, which start nothing.
#
# Not from scratch every time: Swatinem/rust-cache keeps the compiled dependencies (all of
# Nushell, most of the build) per architecture, so a run builds only nux itself. The cache
# starts over when Cargo.lock or the Rust version (rust-toolchain.toml) changes, and after
# 7 days without a run.

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: its glibc (2.35) is old enough for the binary to run on most current
          # distributions.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    name: linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      # The version in rust-toolchain.toml (without arguments, `install` takes it from there).
      - name: Rust
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # `js` in the tests needs Node 26 (Temporal).
      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # `search` in the tests needs ripgrep, which the runner image does not have.
      - name: ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep

      # `ast-find` in the tests needs ast-grep. A fixed version: tests/ast-rewrite depends on
      # how it matches statements (see the README there); a new one is checked on purpose.
      - name: ast-grep
        run: |
          case "${{ matrix.arch }}" in x86_64) target=x86_64 ;; arm64) target=aarch64 ;; esac
          curl -fsSL -o /tmp/ast-grep.zip "https://github.com/ast-grep/ast-grep/releases/download/0.51.3/app-$target-unknown-linux-gnu.zip"
          sudo unzip -o /tmp/ast-grep.zip ast-grep -d /usr/local/bin
          ast-grep --version

      - name: Build
        run: cargo build --release --locked

      # Same profile as the build, so nothing is compiled again for the tests but the tests.
      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          mkdir -p dist
          strip -o dist/nux target/release/nux
          tar -czf dist/nux-linux-${{ matrix.arch }}.tar.gz -C dist nux
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: nux-linux-${{ matrix.arch }}
          path: dist/nux-linux-${{ matrix.arch }}.tar.gz

  # After both builds and their tests passed: a release for the version in Cargo.toml, unless
  # there is one already (then this run was only a build).
  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is released already: raise the version in Cargo.toml for a new release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" dist/*.tar.gz --target "${{ github.sha }}" --generate-notes
